plan:
  - id: M0
    name: "recon: confirm what the portal says and what main and the branch hold"
    tasks:
      - "ask the operator for the portal confirmation, grade and label (UC1, UC2)"
      - "git fetch; git status --short; git log --oneline -3; git rev-parse --short origin/main origin/feat/attributes"
    depends_on: []
    exit_criteria: "origin/main is 174fba5 (or later docs-only commits), origin/feat/attributes is fd341e2, tree clean, operator reported the grade"
  - id: M1
    name: "decide whether to merge attributes for the resubmit (DR1)"
    tasks:
      - "ask the operator; if yes, rehearse with git merge-tree --write-tree main feat/attributes"
      - "if yes, rerun --all, the three experiments and --table; list every changed number"
    depends_on: [M0]
    exit_criteria: "operator has said merge or leave; if merge, a list of every README and model card block that must change exists"
  - id: M2
    name: "merge and regenerate (only if M1 says merge)"
    tasks:
      - "operator runs the merge; sessions regenerate output blocks and recheck model card numbers; operator rewrites his affected sentences"
      - "add favorite_decade, mood_tags, avoid_explicit to PROFILES only if the operator wants the new terms visible (not decided)"
    depends_on: [M1]
    exit_criteria: ".venv/bin/python -m pytest -v shows 50 passed and no README or model card number disagrees with a fresh --all run"
  - id: M3
    name: "resubmit with SF8 and then record it"
    tasks: ["operator resubmits; append a #note line and update DEADLINES.md in the study repo"]
    depends_on: [M2]
    exit_criteria: "operator reports the new portal result"

